name: Build Any URL Universal Fix

on:
  workflow_dispatch:
    inputs:
      url:
        description: Website URL
        required: true
        type: string
      appName:
        description: App Name
        required: true
        type: string
      packageName:
        description: Package ID
        required: true
        type: string
      buildId:
        description: Build ID
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /home/runner/sdk
      ANDROID_SDK_ROOT: /home/runner/sdk
      ANDROID_SDK_HOME: /home/runner/sdk

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK - FIX SDK conflict
        run: |
          set -e
          # FIX: Unset system SDK to prevent conflict
          unset ANDROID_SDK_ROOT
          unset ANDROID_HOME
          rm -rf $HOME/sdk
          mkdir -p $HOME/sdk/cmdline-tools
          cd $HOME/sdk/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O t.zip
          unzip -q t.zip
          mv cmdline-tools latest
          export ANDROID_HOME=$HOME/sdk
          export PATH=$HOME/sdk/cmdline-tools/latest/bin:$HOME/sdk/platform-tools:$PATH
          echo "ANDROID_HOME=$HOME/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$HOME/sdk" >> $GITHUB_ENV
          echo "$HOME/sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$HOME/sdk/platform-tools" >> $GITHUB_PATH
          # Use only ANDROID_HOME, install SDK
          yes | $HOME/sdk/cmdline-tools/latest/bin/sdkmanager --licenses
          $HOME/sdk/cmdline-tools/latest/bin/sdkmanager --install "platform-tools" "build-tools;34.0.0" "platforms;android-34" "platforms;android-33"

      - name: Setup Gradle 8.5
        run: |
          cd /tmp
          wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip
          unzip -q gradle-8.5-bin.zip
          echo "/tmp/gradle-8.5/bin" >> $GITHUB_PATH

      - name: Create project
        run: |
          rm -rf app build .gradle gradle gradlew settings.gradle build.gradle gradle.properties
          mkdir -p app/src/main/java/com/web2app
          mkdir -p app/src/main/res/mipmap-hdpi app/src/main/res/mipmap-mdpi app/src/main/res/mipmap-xhdpi app/src/main/res/mipmap-xxhdpi app/src/main/res/mipmap-xxxhdpi app/src/main/res/values

      - name: Keystore Signed
        run: |
          keytool -genkey -v -keystore release.keystore -alias release -keyalg RSA -keysize 2048 -validity 10000 -storepass android123 -keypass android123 -dname "CN=247, OU=Mobile, O=247, L=Ludhiana, ST=Punjab, C=IN"

      - name: Icon auto-crop
        run: |
          pip install Pillow -q
          python3 << 'PY'
          import os
          from PIL import Image
          bid="${{ inputs.buildId }}"
          p=f"temp-icons/{bid}-icon.png"
          def defa():
              im=Image.new('RGBA',(512,512),(15,23,42,255))
              for f in ['mipmap-mdpi','mipmap-hdpi','mipmap-xhdpi','mipmap-xxhdpi','mipmap-xxxhdpi']:
                  im.save(f"app/src/main/res/{f}/ic_launcher.png")
                  im.save(f"app/src/main/res/{f}/ic_launcher_round.png")
          try:
              if os.path.exists(p):
                  im=Image.open(p).convert('RGBA')
                  w,h=im.size
                  r=max(512/w,512/h)
                  nw,nh=int(w*r),int(h*r)
                  im=im.resize((nw,nh), Image.LANCZOS)
                  im=im.crop(((nw-512)//2,(nh-512)//2,(nw+512)//2,(nh+512)//2))
                  for f,s in {'mipmap-mdpi':48,'mipmap-hdpi':72,'mipmap-xhdpi':96,'mipmap-xxhdpi':144,'mipmap-xxxhdpi':192}.items():
                      im.resize((s,s), Image.LANCZOS).save(f"app/src/main/res/{f}/ic_launcher.png")
                      im.resize((s,s), Image.LANCZOS).save(f"app/src/main/res/{f}/ic_launcher_round.png")
              else:
                  defa()
          except Exception as e:
              print(e)
              defa()
          PY

      - name: Generate Universal Any-URL Crash-Proof Files
        run: |
          cat > settings.gradle << 'EOF'
          include ':app'
          EOF
          cat > build.gradle << 'EOF'
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.2.0' }
          }
          allprojects { repositories { google(); mavenCentral() } }
          EOF
          cat > gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=false
          EOF
          cat > app/src/main/res/values/colors.xml << 'EOF'
          <resources><color name="bg">#ffffff</color></resources>
          EOF
          cat > app/src/main/res/values/themes.xml << 'EOF'
          <resources>
              <style name="AppTheme" parent="android:Theme.NoTitleBar">
                  <item name="android:windowBackground">@color/bg</item>
              </style>
          </resources>
          EOF
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.example.app">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
              <application android:icon="@mipmap/ic_launcher" android:theme="@style/AppTheme" android:hardwareAccelerated="true" android:usesCleartextTraffic="true" android:largeHeap="true">
                  <activity android:name=".MainActivity" android:exported="true" android:configChanges="orientation|keyboardHidden|screenSize"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity>
              </application>
          </manifest>
          EOF
          sed -i "s/com.example.app/${{ inputs.packageName }}/g" app/src/main/AndroidManifest.xml

          cat > app/src/main/java/com/web2app/MainActivity.java << 'JAVA'
          package com.web2app;
          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.LinearLayout;
          import android.view.ViewGroup;
          public class MainActivity extends Activity {
              private WebView webView;
              @Override protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setLayoutParams(new LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));
                  webView = new WebView(this);
                  webView.setLayoutParams(new LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));
                  WebSettings s = webView.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setJavaScriptCanOpenWindowsAutomatically(true);
                  s.setLoadsImagesAutomatically(true);
                  s.setUseWideViewPort(true);
                  s.setLoadWithOverviewMode(true);
                  s.setAllowFileAccess(true);
                  s.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);
                  webView.setWebViewClient(new WebViewClient() {
                      @Override public boolean shouldOverrideUrlLoading(WebView view, String url) {
                          if (url != null) view.loadUrl(url);
                          return true;
                      }
                  });
                  webView.loadUrl("https://flightsnetwork.co.in/");
                  root.addView(webView);
                  setContentView(root);
              }
              @Override public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) webView.goBack(); else super.onBackPressed();
              }
              @Override protected void onDestroy() {
                  if (webView != null) webView.destroy();
                  super.onDestroy();
              }
          }
          JAVA
          sed -i "s|https://flightsnetwork.co.in/|${{ inputs.url }}|g" app/src/main/java/com/web2app/MainActivity.java || true

          cat > app/build.gradle << 'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.example.app'
              compileSdk 33
              signingConfigs {
                  release {
                      storeFile file('../release.keystore')
                      storePassword 'android123'
                      keyAlias 'release'
                      keyPassword 'android123'
                      v1SigningEnabled true
                      v2SigningEnabled true
                  }
              }
              defaultConfig {
                  applicationId "com.example.app"
                  minSdk 21
                  targetSdk 33
                  versionCode 1
                  versionName "1.0"
              }
              buildTypes {
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.release
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
          }
          dependencies {}
          EOF
          sed -i "s/com.example.app/${{ inputs.packageName }}/g" app/build.gradle

      - name: Build APK - FIXED SDK conflict
        run: |
          export ANDROID_HOME=$HOME/sdk
          export ANDROID_SDK_ROOT=$HOME/sdk
          export PATH=$HOME/sdk/cmdline-tools/latest/bin:$HOME/sdk/platform-tools:$PATH
          echo "Using SDK: $ANDROID_HOME"
          ls $ANDROID_HOME/build-tools/ || echo "no build tools"
          /tmp/gradle-8.5/bin/gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          ls -lh app/build/outputs/apk/release/
          $HOME/sdk/build-tools/34.0.0/apksigner verify --verbose app/build/outputs/apk/release/*.apk || true

      - name: Upload APK Free
        uses: actions/upload-artifact@v4
        with:
          name: apk-free-${{ inputs.buildId }}
          path: app/build/outputs/apk/release/*.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: aab-paid-${{ inputs.buildId }}
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: ignore
