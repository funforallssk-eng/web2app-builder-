name: Build APK AAB

on:
  workflow_dispatch:
    inputs:
      url:
        description: Website URL
        required: true
        type: string
      appName:
        description: App Name
        required: true
        type: string
      packageName:
        description: Package ID
        required: true
        type: string
      buildId:
        description: Build ID
        required: true
        type: string
      iconBase64:
        description: Icon
        required: false
        default: ''
        type: string
      splashBase64:
        description: Splash
        required: false
        default: ''
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup SDK
        run: |
          set -e
          mkdir -p $HOME/sdk/cmdline-tools
          cd $HOME/sdk/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O t.zip
          unzip -q t.zip
          mv cmdline-tools latest
          export ANDROID_HOME=$HOME/sdk
          export ANDROID_SDK_ROOT=$HOME/sdk
          export PATH=$HOME/sdk/cmdline-tools/latest/bin:$HOME/sdk/platform-tools:$PATH
          echo "ANDROID_HOME=$HOME/sdk" >> $GITHUB_ENV
          echo "$HOME/sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$HOME/sdk/platform-tools" >> $GITHUB_PATH
          $HOME/sdk/cmdline-tools/latest/bin/sdkmanager --version
          yes | $HOME/sdk/cmdline-tools/latest/bin/sdkmanager --licenses
          $HOME/sdk/cmdline-tools/latest/bin/sdkmanager --install "platform-tools" "build-tools;34.0.0" "platforms;android-34"

      - name: Create project
        run: |
          rm -rf app build .gradle gradle gradlew settings.gradle build.gradle gradle.properties
          mkdir -p app/src/main/java/com/web2app
          mkdir -p app/src/main/res/mipmap-hdpi app/src/main/res/mipmap-mdpi app/src/main/res/mipmap-xhdpi app/src/main/res/mipmap-xxhdpi app/src/main/res/mipmap-xxxhdpi
          mkdir -p app/src/main/res/drawable app/src/main/res/values

      - name: Icon auto-crop
        env:
          ICON_B64: ${{ inputs.iconBase64 }}
        run: |
          pip install Pillow -q
          python3 << 'PY'
          import base64, io, os
          from PIL import Image
          b64=os.environ.get('ICON_B64','')
          try:
            if ',' in b64: b64=b64.split(',')[1]
            if len(b64)>100:
              img=Image.open(io.BytesIO(base64.b64decode(b64))).convert('RGBA')
            else:
              img=Image.new('RGBA',(512,512),(15,23,42,255))
            # auto-crop cover 512x512
            def cover_crop(im, size):
              w,h = im.size
              ratio = max(size[0]/w, size[1]/h)
              nw, nh = int(w*ratio), int(h*ratio)
              im = im.resize((nw,nh), Image.LANCZOS)
              left = (nw-size[0])//2
              top = (nh-size[1])//2
              return im.crop((left,top,left+size[0],top+size[1]))
            img512 = cover_crop(img, (512,512))
            for f,s in {'mipmap-mdpi':48,'mipmap-hdpi':72,'mipmap-xhdpi':96,'mipmap-xxhdpi':144,'mipmap-xxxhdpi':192}.items():
              img512.resize((s,s), Image.LANCZOS).save(f"app/src/main/res/{f}/ic_launcher.png")
              img512.resize((s,s), Image.LANCZOS).save(f"app/src/main/res/{f}/ic_launcher_round.png")
            img512.resize((200,200), Image.LANCZOS).save("app/src/main/res/drawable/splash_icon.png")
            print("icon auto-cropped ok")
          except Exception as e:
            print(f"icon error {e}")
            img=Image.new('RGBA',(512,512),(15,23,42,255))
            for f in ['mipmap-mdpi','mipmap-hdpi','mipmap-xhdpi','mipmap-xxhdpi','mipmap-xxxhdpi']:
              img.save(f"app/src/main/res/{f}/ic_launcher.png")
              img.save(f"app/src/main/res/{f}/ic_launcher_round.png")
            img.save("app/src/main/res/drawable/splash_icon.png")
          PY

      - name: Splash auto-crop
        env:
          SPLASH_B64: ${{ inputs.splashBase64 }}
        run: |
          python3 << 'PY'
          import base64, io, os
          from PIL import Image
          b64=os.environ.get('SPLASH_B64','')
          if len(b64)<100:
            print("no splash")
            exit(0)
          try:
            if ',' in b64: b64=b64.split(',')[1]
            img=Image.open(io.BytesIO(base64.b64decode(b64))).convert('RGBA')
            # auto-crop to 800 max
            img.thumbnail((800,800), Image.LANCZOS)
            img.save("app/src/main/res/drawable/splash_center.png")
            print("splash auto-cropped ok")
          except Exception as e:
            print(f"splash error {e}")
          PY

      - name: Generate files
        run: |
          cat > settings.gradle << 'EOF'
          include ':app'
          EOF
          cat > build.gradle << 'EOF'
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.2.0'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF
          cat > gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF
          cat > app/src/main/res/values/colors.xml << 'EOF'
          <resources><color name="colorPrimary">#0f172a</color><color name="splashBackground">#0f172a</color></resources>
          EOF
          cat > app/src/main/res/values/themes.xml << 'EOF'
          <resources><style name="SplashTheme" parent="Theme.SplashScreen"><item name="windowSplashScreenBackground">@color/splashBackground</item><item name="windowSplashScreenAnimatedIcon">@drawable/splash_icon</item><item name="postSplashScreenTheme">@style/AppTheme</item></style><style name="AppTheme" parent="Theme.Material3.DayNight.NoActionBar"></style></resources>
          EOF
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.example.app"><uses-permission android:name="android.permission.INTERNET"/><application android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher_round" android:theme="@style/SplashTheme"><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>
          EOF
          sed -i "s/com.example.app/${{ inputs.packageName }}/g" app/src/main/AndroidManifest.xml || true
          cat > app/src/main/java/com/web2app/MainActivity.java << 'JAVA'
          package com.web2app;
          import android.os.Bundle; import android.webkit.WebSettings; import android.webkit.WebView; import android.webkit.WebViewClient; import androidx.appcompat.app.AppCompatActivity; import androidx.core.splashscreen.SplashScreen; import androidx.swiperefreshlayout.widget.SwipeRefreshLayout;
          public class MainActivity extends AppCompatActivity {
            private WebView webView; private SwipeRefreshLayout swipeRefresh;
            @Override protected void onCreate(Bundle savedInstanceState) {
              SplashScreen.installSplashScreen(this); super.onCreate(savedInstanceState);
              swipeRefresh=new SwipeRefreshLayout(this); webView=new WebView(this); swipeRefresh.addView(webView); setContentView(swipeRefresh); swipeRefresh.setOnRefreshListener(()->webView.reload());
              WebSettings s=webView.getSettings(); s.setJavaScriptEnabled(true); s.setDomStorageEnabled(true);
              webView.setWebViewClient(new WebViewClient(){ @Override public void onPageFinished(WebView v,String u){ super.onPageFinished(v,u); swipeRefresh.setRefreshing(false); } });
              webView.loadUrl("https://example.com");
            }
            @Override public void onBackPressed(){ if(webView.canGoBack()) webView.goBack(); else super.onBackPressed(); }
          }
          JAVA
          sed -i "s|https://example.com|${{ inputs.url }}|g" app/src/main/java/com/web2app/MainActivity.java || true
          cat > app/build.gradle << 'EOF'
          plugins { id 'com.android.application' }
          android { namespace 'com.example.app'; compileSdk 34; defaultConfig { applicationId "com.example.app"; minSdk 21; targetSdk 34; versionCode 1; versionName "1.0" } buildTypes { release { minifyEnabled false } } }
          dependencies { implementation 'androidx.appcompat:appcompat:1.6.1'; implementation 'androidx.core:core-splashscreen:1.0.1'; implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'; implementation 'com.google.android.material:material:1.11.0' }
          EOF
          sed -i "s/com.example.app/${{ inputs.packageName }}/g" app/build.gradle || true

      - name: Build
        run: |
          gradle wrapper --gradle-version 8.5 --no-daemon || true
          chmod +x gradlew || true
          if [ -f ./gradlew ]; then ./gradlew assembleRelease bundleRelease --no-daemon; else gradle assembleRelease bundleRelease --no-daemon; fi
          ls -lh app/build/outputs/apk/release/ || true
          ls -lh app/build/outputs/bundle/release/ || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apk-free-${{ inputs.buildId }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aab-paid-${{ inputs.buildId }}
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn
