name: Build APK AAB - FIXED NO TOOLS

on:
  workflow_dispatch:
    inputs:
      url: { required: true, type: string }
      appName: { required: true, type: string }
      packageName: { required: true, type: string }
      buildId: { required: true, type: string }
      iconBase64: { required: false, type: string, default: '' }
      splashBase64: { required: false, type: string, default: '' }
      splashBgColor: { required: false, default: '#0f172a', type: string }
      iconBgColor: { required: false, default: '#0f172a', type: string }
      pullToRefresh: { required: false, default: 'true', type: string }
      splashDuration: { required: false, default: '2000', type: string }
      statusBarColor: { required: false, default: '#0f172a', type: string }
      orientation: { required: false, default: 'portrait', type: string }

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '17' }

      # FIXED - DO NOT USE android-actions/setup-android@v3 with tools
      - name: Setup Android SDK Manually - FIXED
        run: |
          mkdir -p $HOME/android-sdk/cmdline-tools
          cd $HOME/android-sdk/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O tools.zip
          unzip -q tools.zip
          mv cmdline-tools latest
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$HOME/android-sdk/platform-tools" >> $GITHUB_PATH
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> $GITHUB_ENV
          yes | $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses
          $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager --install "platform-tools" "build-tools;34.0.0" "platforms;android-34" "platforms;android-33"

      - name: Build Project
        run: |
          mkdir -p app/src/main/res/mipmap-hdpi app/src/main/res/mipmap-mdpi app/src/main/res/mipmap-xhdpi app/src/main/res/mipmap-xxhdpi app/src/main/res/mipmap-xxxhdpi app/src/main/res/drawable app/src/main/res/values app/src/main/java/com/web2app
          # ... your icon/splash python code here (same as before) ...
          echo "Building..."
          # create dummy APK/AAB for now to test fix
          mkdir -p app/build/outputs/apk/release app/build/outputs/bundle/release
          echo "APK ${{ inputs.buildId }}" > app/build/outputs/apk/release/app-release.apk
          echo "AAB ${{ inputs.buildId }}" > app/build/outputs/bundle/release/app-release.aab

      - uses: actions/upload-artifact@v4
        with: { name: ${{ inputs.buildId }}-apk-FREE, path: app/build/outputs/apk/release/*.apk }
      - uses: actions/upload-artifact@v4
        with: { name: ${{ inputs.buildId }}-aab-PAID-499, path: app/build/outputs/bundle/release/*.aab }
