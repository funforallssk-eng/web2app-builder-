name: Auto Build APK + AAB

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'Website URL'
        required: true
        type: string
      appName:
        description: 'App Name'
        required: true
        type: string
      packageName:
        description: 'Package Name (com.example.app)'
        required: true
        type: string
      buildId:
        description: 'Build ID'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Capacitor
        run: npm install -g @capacitor/cli @capacitor/core

      - name: Create App
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/android
          
          npx cap init "${{ inputs.appName }}" "${{ inputs.packageName }}" --web-dir=www
          
          mkdir -p www
          cat > www/index.html << HTML
          <!DOCTYPE html>
          <html>
          <head>
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <style>
              body { margin:0; padding:0; overflow:hidden; }
              iframe { width:100vw; height:100vh; border:0; }
            </style>
          </head>
          <body>
            <iframe src="${{ inputs.url }}" allow="camera; microphone; geolocation"></iframe>
          </body>
          </html>
          HTML

          cat > capacitor.config.json << JSON
          {
            "appId": "${{ inputs.packageName }}",
            "appName": "${{ inputs.appName }}",
            "webDir": "www",
            "server": {
              "androidScheme": "https"
            }
          }
          JSON

          npx cap add android

          # FIX 1: Force Kotlin version to 1.8.22
          sed -i "s/ext.kotlin_version = '.*'/ext.kotlin_version = '1.8.22'/" android/build.gradle || true
          
          # FIX 2: Remove duplicate Kotlin stdlib (the error you got)
          cat >> android/app/build.gradle << 'GRADLE'

          // Fix duplicate kotlin classes
          configurations.all {
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
          }
          GRADLE

          # Update app name
          sed -i "s/<string name=\"app_name\">.*<\/string>/<string name=\"app_name\">${{ inputs.appName }}<\/string>/g" android/app/src/main/res/values/strings.xml || true

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Build AAB
        run: |
          cd android
          ./gradlew bundleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.appName }}-APK-${{ inputs.buildId }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.appName }}-AAB-${{ inputs.buildId }}
          path: android/app/build/outputs/bundle/debug/app-debug.aab
          if-no-files-found: error

      - name: Rename for Release
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk ${{ inputs.appName }}-${{ inputs.buildId }}.apk
          cp android/app/build/outputs/bundle/debug/app-debug.aab ${{ inputs.appName }}-${{ inputs.buildId }}.aab
          ls -lh *.apk *.aab

      - name: Create Direct Download Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ inputs.buildId }}
          name: ${{ inputs.appName }} Build ${{ inputs.buildId }}
          body: |
            Website: ${{ inputs.url }}
            App: ${{ inputs.appName }}
            Package: ${{ inputs.packageName }}
            Build ID: ${{ inputs.buildId }}
            
            Direct download links (no login needed):
          files: |
            ${{ inputs.appName }}-${{ inputs.buildId }}.apk
            ${{ inputs.appName }}-${{ inputs.buildId }}.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
