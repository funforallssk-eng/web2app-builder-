name: Auto Build APK + AAB

on:
  workflow_dispatch:
    inputs:
      url:
        required: true
        type: string
      appName:
        required: true
        type: string
      packageName:
        required: true
        type: string
      buildId:
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Capacitor
        run: npm install -g @capacitor/cli @capacitor/core

      - name: Create App
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/android
          npx cap init "${{ inputs.appName }}" "${{ inputs.packageName }}" --web-dir=www
          mkdir -p www
          cat > www/index.html << 'HTML'
          <!DOCTYPE html>
          <html><head><meta name="viewport" content="width=device-width"><style>body{margin:0}iframe{width:100vw;height:100vh;border:0}</style></head>
          <body><iframe src="${{ inputs.url }}"></iframe></body></html>
          HTML
          cat > capacitor.config.json << JSON
          {
            "appId": "${{ inputs.packageName }}",
            "appName": "${{ inputs.appName }}",
            "webDir": "www",
            "server": { "androidScheme": "https" }
          }
          JSON
          npx cap add android
          # Update app name
          sed -i "s/<string name=\"app_name\">.*<\/string>/<string name=\"app_name\">${{ inputs.appName }}<\/string>/g" android/app/src/main/res/values/strings.xml || true
          # Enable internet
          grep -q "INTERNET" android/app/src/main/AndroidManifest.xml || sed -i '/<application/a \    <uses-permission android:name="android.permission.INTERNET" />' android/app/src/main/AndroidManifest.xml || true

      - name: Build APK (Debug)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Build AAB (Release)
        run: |
          cd android
          ./gradlew bundleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.appName }}-APK-${{ inputs.buildId }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.appName }}-AAB-${{ inputs.buildId }}
          path: android/app/build/outputs/bundle/debug/app-debug.aab
          if-no-files-found: error
