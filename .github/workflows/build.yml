name: Auto Build APK + AAB

on:
  workflow_dispatch:
    inputs:
      url: { required: true, type: string }
      appName: { required: true, type: string }
      packageName: { required: true, type: string }
      buildId: { required: true, type: string }

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Capacitor
        run: npm install -g @capacitor/cli @capacitor/core

      - name: Create App
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/android
          npx cap init "${{ inputs.appName }}" "${{ inputs.packageName }}" --web-dir=www
          mkdir -p www
          cat > www/index.html << HTML
          <!DOCTYPE html>
          <html><head><meta name="viewport" content="width=device-width"><style>body{margin:0}iframe{width:100vw;height:100vh;border:0}</style></head>
          <body><iframe src="${{ inputs.url }}"></iframe></body></html>
          HTML
          cat > capacitor.config.json << JSON
          {
            "appId": "${{ inputs.packageName }}",
            "appName": "${{ inputs.appName }}",
            "webDir": "www",
            "server": { "androidScheme": "https" }
          }
          JSON
          npx cap add android
          # FIX KOTLIN DUPLICATE - THIS IS THE FIX
          sed -i "s/ext.kotlin_version = '.*'/ext.kotlin_version = '1.8.22'/" android/build.gradle || true
          # Add duplicate exclusion
          cat >> android/app/build.gradle << 'GRADLE'
          
          configurations.all {
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
          }
          GRADLE
          # Update app name
          sed -i "s/<string name=\"app_name\">.*<\/string>/<string name=\"app_name\">${{ inputs.appName }}<\/string>/g" android/app/src/main/res/values/strings.xml || true

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Build AAB
        run: |
          cd android
          ./gradlew bundleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.appName }}-APK-${{ inputs.buildId }}
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.appName }}-AAB-${{ inputs.buildId }}
          path: android/app/build/outputs/bundle/debug/app-debug.aab
