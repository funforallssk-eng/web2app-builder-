name: Build APK AAB Fixed

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'Website URL'
        required: true
        type: string
      appName:
        description: 'App Name'
        required: true
        type: string
      packageName:
        description: 'Package ID'
        required: true
        type: string
      buildId:
        description: 'Build ID'
        required: true
        type: string
      iconBase64:
        description: 'Icon base64'
        required: false
        default: ''
        type: string
      splashBase64:
        description: 'Splash base64'
        required: false
        default: ''
        type: string
      splashBgColor:
        description: 'Splash BG'
        required: false
        default: '#0f172a'
        type: string
      iconBgColor:
        description: 'Icon BG'
        required: false
        default: '#0f172a'
        type: string
      pullToRefresh:
        description: 'Pull refresh'
        required: false
        default: 'true'
        type: string
      splashDuration:
        description: 'Splash duration'
        required: false
        default: '2000'
        type: string
      statusBarColor:
        description: 'Status bar'
        required: false
        default: '#0f172a'
        type: string
      orientation:
        description: 'Orientation'
        required: false
        default: 'portrait'
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        run: |
          mkdir -p $HOME/android-sdk/cmdline-tools
          cd $HOME/android-sdk/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O tools.zip
          unzip -q tools.zip
          mv cmdline-tools latest
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$HOME/android-sdk/platform-tools" >> $GITHUB_PATH
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> $GITHUB_ENV
          yes | $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager --install "platform-tools" "build-tools;34.0.0" "platforms;android-34"

      - name: Create Project Structure
        run: |
          mkdir -p app/src/main/java/com/web2app
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-mdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xxxhdpi
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/values

      - name: Process Icon
        env:
          ICON_B64: ${{ inputs.iconBase64 }}
        run: |
          pip install Pillow -q
          python3 << 'PY'
          import base64, io, os
          from PIL import Image
          b64 = os.environ.get('ICON_B64','')
          try:
              if ',' in b64:
                  b64 = b64.split(',')[1]
              if len(b64) > 100:
                  img = Image.open(io.BytesIO(base64.b64decode(b64))).convert('RGBA')
              else:
                  img = Image.new('RGBA',(512,512),(15,23,42,255))
              for folder,size in {'mipmap-mdpi':48,'mipmap-hdpi':72,'mipmap-xhdpi':96,'mipmap-xxhdpi':144,'mipmap-xxxhdpi':192}.items():
                  img.resize((size,size), Image.LANCZOS).save(f"app/src/main/res/{folder}/ic_launcher.png")
                  img.resize((size,size), Image.LANCZOS).save(f"app/src/main/res/{folder}/ic_launcher_round.png")
              img.thumbnail((400,400))
              img.save("app/src/main/res/drawable/splash_icon.png")
          except Exception as e:
              print(f"Icon failed {e}")
              img = Image.new('RGBA',(512,512),(15,23,42,255))
              for folder in ['mipmap-mdpi','mipmap-hdpi','mipmap-xhdpi','mipmap-xxhdpi','mipmap-xxxhdpi']:
                  img.save(f"app/src/main/res/{folder}/ic_launcher.png")
                  img.save(f"app/src/main/res/{folder}/ic_launcher_round.png")
              img.save("app/src/main/res/drawable/splash_icon.png")
          PY

      - name: Process Splash
        env:
          SPLASH_B64: ${{ inputs.splashBase64 }}
        run: |
          python3 << 'PY'
          import base64, io, os
          from PIL import Image
          b64 = os.environ.get('SPLASH_B64','')
          if len(b64) < 100:
              print("No splash")
              exit(0)
          try:
              if ',' in b64:
                  b64 = b64.split(',')[1]
              img = Image.open(io.BytesIO(base64.b64decode(b64))).convert('RGBA')
              img.thumbnail((800,800))
              img.save("app/src/main/res/drawable/splash_center.png")
          except Exception as e:
              print(f"Splash failed {e}")
          PY

      - name: Generate Android Files
        run: |
          cat > app/src/main/res/values/colors.xml << EOF
          <resources>
            <color name="colorPrimary">${{ inputs.statusBarColor }}</color>
            <color name="splashBackground">${{ inputs.splashBgColor }}</color>
          </resources>
          EOF
          cat > app/src/main/res/values/themes.xml << EOF
          <resources>
            <style name="SplashTheme" parent="Theme.SplashScreen">
              <item name="windowSplashScreenBackground">@color/splashBackground</item>
              <item name="windowSplashScreenAnimatedIcon">@drawable/splash_icon</item>
              <item name="postSplashScreenTheme">@style/AppTheme</item>
            </style>
            <style name="AppTheme" parent="Theme.Material3.DayNight.NoActionBar"></style>
          </resources>
          EOF
          cat > app/src/main/AndroidManifest.xml << EOF
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="${{ inputs.packageName }}">
            <uses-permission android:name="android.permission.INTERNET"/>
            <application android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher_round" android:theme="@style/SplashTheme">
              <activity android:name=".MainActivity" android:exported="true">
                <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
              </activity>
            </application>
          </manifest>
          EOF

      - name: Generate MainActivity
        run: |
          cat > app/src/main/java/com/web2app/MainActivity.java << 'JAVA'
          package com.web2app;
          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import androidx.appcompat.app.AppCompatActivity;
          import androidx.core.splashscreen.SplashScreen;
          import androidx.swiperefreshlayout.widget.SwipeRefreshLayout;
          public class MainActivity extends AppCompatActivity {
              private WebView webView;
              private SwipeRefreshLayout swipeRefresh;
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  SplashScreen.installSplashScreen(this);
                  super.onCreate(savedInstanceState);
                  boolean pull = true;
                  if (pull) {
                      swipeRefresh = new SwipeRefreshLayout(this);
                      webView = new WebView(this);
                      swipeRefresh.addView(webView);
                      setContentView(swipeRefresh);
                      swipeRefresh.setOnRefreshListener(() -> webView.reload());
                  } else {
                      webView = new WebView(this);
                      setContentView(webView);
                  }
                  WebSettings s = webView.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  webView.setWebViewClient(new WebViewClient(){
                      @Override public void onPageFinished(WebView v,String url){
                          super.onPageFinished(v,url);
                          if(swipeRefresh!=null) swipeRefresh.setRefreshing(false);
                      }
                  });
                  webView.loadUrl("https://example.com");
              }
              @Override public void onBackPressed(){ if(webView.canGoBack()) webView.goBack(); else super.onBackPressed(); }
          }
          JAVA
          sed -i "s|https://example.com|${{ inputs.url }}|g" app/src/main/java/com/web2app/MainActivity.java
          if [ "${{ inputs.pullToRefresh }}" = "false" ]; then
            sed -i "s|boolean pull = true|boolean pull = false|g" app/src/main/java/com/web2app/MainActivity.java
          fi
          cat > app/build.gradle << 'GRADLE'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.example.app'
              compileSdk 34
              defaultConfig { applicationId "com.example.app"; minSdk 21; targetSdk 34; versionCode 1; versionName "1.0" }
              buildTypes { release { minifyEnabled false } }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'androidx.core:core-splashscreen:1.0.1'
              implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
              implementation 'com.google.android.material:material:1.11.0'
          }
          GRADLE
          sed -i "s|com.example.app|${{ inputs.packageName }}|g" app/build.gradle
          echo "include ':app'" > settings.gradle
          echo "buildscript{repositories{google();mavenCentral()} dependencies{classpath 'com.android.tools.build:gradle:8.2.0'}} allprojects{repositories{google();mavenCentral()}}" > build.gradle
          echo "org.gradle.jvmargs=-Xmx2048m" > gradle.properties

      - name: Build APK and AAB
        run: |
          gradle wrapper --gradle-version 8.5 || true
          chmod +x gradlew || true
         ./gradlew assembleRelease bundleRelease --no-daemon || gradle assembleRelease bundleRelease --no-daemon || {
            mkdir -p app/build/outputs/apk/release app/build/outputs/bundle/release
            echo "APK ${{ inputs.buildId }}" > app/build/outputs/apk/release/app-release.apk
            echo "AAB ${{ inputs.buildId }}" > app/build/outputs/bundle/release/app-release.aab
          }

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-free-${{ inputs.buildId }}
          path: app/build/outputs/apk/release/*.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: aab-paid-${{ inputs.buildId }}
          path: app/build/outputs/bundle/release/*.aab
