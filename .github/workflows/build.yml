name: Build APK AAB Signed

on:
  workflow_dispatch:
    inputs:
      url:
        description: Website URL
        required: true
        type: string
      appName:
        description: App Name
        required: true
        type: string
      packageName:
        description: Package ID
        required: true
        type: string
      buildId:
        description: Build ID
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        run: |
          set -e
          mkdir -p $HOME/sdk/cmdline-tools
          cd $HOME/sdk/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O t.zip
          unzip -q t.zip
          mv cmdline-tools latest
          export ANDROID_HOME=$HOME/sdk
          export ANDROID_SDK_ROOT=$HOME/sdk
          export PATH=$HOME/sdk/cmdline-tools/latest/bin:$HOME/sdk/platform-tools:$PATH
          echo "ANDROID_HOME=$HOME/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$HOME/sdk" >> $GITHUB_ENV
          echo "$HOME/sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$HOME/sdk/platform-tools" >> $GITHUB_PATH
          $HOME/sdk/cmdline-tools/latest/bin/sdkmanager --version
          yes | $HOME/sdk/cmdline-tools/latest/bin/sdkmanager --licenses
          $HOME/sdk/cmdline-tools/latest/bin/sdkmanager --install "platform-tools" "build-tools;34.0.0" "platforms;android-34"

      - name: Setup Gradle 8.5
        run: |
          cd /tmp
          wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip
          unzip -q gradle-8.5-bin.zip
          echo "/tmp/gradle-8.5/bin" >> $GITHUB_PATH
          /tmp/gradle-8.5/bin/gradle --version

      - name: Create project dirs
        run: |
          rm -rf app build .gradle gradle gradlew settings.gradle build.gradle gradle.properties
          mkdir -p app/src/main/java/com/web2app
          mkdir -p app/src/main/res/mipmap-hdpi app/src/main/res/mipmap-mdpi app/src/main/res/mipmap-xhdpi app/src/main/res/mipmap-xxhdpi app/src/main/res/mipmap-xxxhdpi
          mkdir -p app/src/main/res/drawable app/src/main/res/values

      - name: Generate Keystore for Signed APK (FIX invalid package)
        run: |
          # Generate release keystore - fixes "package seems invalid"
          keytool -genkey -v -keystore release.keystore -alias release -keyalg RSA -keysize 2048 -validity 10000 -storepass android123 -keypass android123 -dname "CN=247 Software, OU=Mobile, O=247, L=Ludhiana, ST=Punjab, C=IN"
          ls -lh release.keystore
          echo "Keystore generated"

      - name: Restore icon and splash from repo
        run: |
          ls -lh temp-icons/ || echo "no temp-icons"
          pip install Pillow -q
          python3 << 'PY'
          import os
          from PIL import Image
          build_id="${{ inputs.buildId }}"
          icon_path=f"temp-icons/{build_id}-icon.png"
          splash_path=f"temp-icons/{build_id}-splash.png"
          def make_default():
              img=Image.new('RGBA',(512,512),(15,23,42,255))
              for f in ['mipmap-mdpi','mipmap-hdpi','mipmap-xhdpi','mipmap-xxhdpi','mipmap-xxxhdpi']:
                  img.save(f"app/src/main/res/{f}/ic_launcher.png")
                  img.save(f"app/src/main/res/{f}/ic_launcher_round.png")
              img.resize((200,200)).save("app/src/main/res/drawable/splash_icon.png")
          try:
              if os.path.exists(icon_path):
                  print(f"Found icon {icon_path}")
                  img=Image.open(icon_path).convert('RGBA')
                  w,h=img.size
                  ratio=max(512/w,512/h)
                  nw,nh=int(w*ratio),int(h*ratio)
                  img=img.resize((nw,nh), Image.LANCZOS)
                  left=(nw-512)//2
                  top=(nh-512)//2
                  img512=img.crop((left,top,left+512,top+512))
                  for f,s in {'mipmap-mdpi':48,'mipmap-hdpi':72,'mipmap-xhdpi':96,'mipmap-xxhdpi':144,'mipmap-xxxhdpi':192}.items():
                      img512.resize((s,s), Image.LANCZOS).save(f"app/src/main/res/{f}/ic_launcher.png")
                      img512.resize((s,s), Image.LANCZOS).save(f"app/src/main/res/{f}/ic_launcher_round.png")
                  img512.resize((200,200), Image.LANCZOS).save("app/src/main/res/drawable/splash_icon.png")
                  print("icon ok")
              else:
                  print("default icon")
                  make_default()
          except Exception as e:
              print(e)
              make_default()
          try:
              if os.path.exists(splash_path):
                  img=Image.open(splash_path).convert('RGBA')
                  img.thumbnail((800,800), Image.LANCZOS)
                  img.save("app/src/main/res/drawable/splash_center.png")
                  print("splash ok")
          except Exception as e:
              print(e)
          PY

      - name: Generate Android files with SIGNING CONFIG
        run: |
          cat > settings.gradle << 'EOF'
          include ':app'
          EOF

          cat > build.gradle << 'EOF'
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.2.0'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          task clean(type: Delete) {
              delete rootProject.buildDir
          }
          EOF

          cat > gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat > app/src/main/res/values/colors.xml << 'EOF'
          <resources><color name="colorPrimary">#0f172a</color><color name="splashBackground">#0f172a</color></resources>
          EOF

          cat > app/src/main/res/values/themes.xml << 'EOF'
          <resources><style name="SplashTheme" parent="Theme.SplashScreen"><item name="windowSplashScreenBackground">@color/splashBackground</item><item name="windowSplashScreenAnimatedIcon">@drawable/splash_icon</item><item name="postSplashScreenTheme">@style/AppTheme</item></style><style name="AppTheme" parent="Theme.Material3.DayNight.NoActionBar"></style></resources>
          EOF

          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.example.app"><uses-permission android:name="android.permission.INTERNET"/><application android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher_round" android:theme="@style/SplashTheme" android:allowBackup="true"><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>
          EOF
          sed -i "s/com.example.app/${{ inputs.packageName }}/g" app/src/main/AndroidManifest.xml || true

          cat > app/src/main/java/com/web2app/MainActivity.java << 'JAVA'
          package com.web2app;
          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import androidx.appcompat.app.AppCompatActivity;
          import androidx.core.splashscreen.SplashScreen;
          import androidx.swiperefreshlayout.widget.SwipeRefreshLayout;
          public class MainActivity extends AppCompatActivity {
            private WebView webView;
            private SwipeRefreshLayout swipeRefresh;
            @Override protected void onCreate(Bundle savedInstanceState) {
              SplashScreen.installSplashScreen(this);
              super.onCreate(savedInstanceState);
              swipeRefresh=new SwipeRefreshLayout(this);
              webView=new WebView(this);
              swipeRefresh.addView(webView);
              setContentView(swipeRefresh);
              swipeRefresh.setOnRefreshListener(()->webView.reload());
              WebSettings s=webView.getSettings();
              s.setJavaScriptEnabled(true);
              s.setDomStorageEnabled(true);
              s.setAllowFileAccess(true);
              s.setMixedContentMode(0);
              webView.setWebViewClient(new WebViewClient(){
                @Override public void onPageFinished(WebView v,String u){
                  super.onPageFinished(v,u);
                  swipeRefresh.setRefreshing(false);
                }
              });
              webView.loadUrl("https://example.com");
            }
            @Override public void onBackPressed(){
              if(webView.canGoBack()) webView.goBack();
              else super.onBackPressed();
            }
          }
          JAVA
          sed -i "s|https://example.com|${{ inputs.url }}|g" app/src/main/java/com/web2app/MainActivity.java || true

          cat > app/build.gradle << 'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.example.app'
              compileSdk 34

              signingConfigs {
                  release {
                      storeFile file('../release.keystore')
                      storePassword 'android123'
                      keyAlias 'release'
                      keyPassword 'android123'
                      v1SigningEnabled true
                      v2SigningEnabled true
                  }
              }

              defaultConfig {
                  applicationId "com.example.app"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      shrinkResources false
                      signingConfig signingConfigs.release
                  }
                  debug {
                      signingConfig signingConfigs.release
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'androidx.core:core-splashscreen:1.0.1'
              implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
              implementation 'com.google.android.material:material:1.11.0'
          }
          EOF
          sed -i "s/com.example.app/${{ inputs.packageName }}/g" app/build.gradle || true

          cat app/build.gradle

      - name: Build SIGNED APK AAB
        run: |
          export ANDROID_HOME=$HOME/sdk
          /tmp/gradle-8.5/bin/gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon --stacktrace
          echo "=== APK info ==="
          ls -lh app/build/outputs/apk/release/
          # Verify APK is signed
          $HOME/sdk/build-tools/34.0.0/apksigner verify --verbose app/build/outputs/apk/release/*.apk || echo "Verify check"
          echo "=== AAB info ==="
          ls -lh app/build/outputs/bundle/release/

      - name: Upload APK SIGNED
        uses: actions/upload-artifact@v4
        with:
          name: apk-free-${{ inputs.buildId }}
          path: app/build/outputs/apk/release/*.apk

      - name: Upload AAB SIGNED
        uses: actions/upload-artifact@v4
        with:
          name: aab-paid-${{ inputs.buildId }}
          path: app/build/outputs/bundle/release/*.aab
