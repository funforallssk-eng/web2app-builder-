        ::-webkit-scrollbar{width:10px}::-webkit-scrollbar-track{background:#1a1e2c}::-webkit-scrollbar-thumb{background:linear-gradient(135deg,#f97316,#ec4899,#8b5cf6);border-radius:20px}
        .gradient-1{background:linear-gradient(135deg,#f97316,#ec4899,#8b5cf6)}
        .gradient-2{background:linear-gradient(135deg,#06b6d4,#8b5cf6,#ec4899)}
        .gradient-3{background:linear-gradient(135deg,#facc15,#f97316,#ef4444)}
        .gradient-4{background:linear-gradient(135deg,#10b981,#06b6d4,#6366f1)}
        .container{max-width:1280px;margin:0 auto;padding:0 24px}
        .navbar{position:fixed;top:0;left:0;width:100%;z-index:1000;padding:18px 0;background:rgba(13,15,26,0.75);backdrop-filter:blur(16px) saturate(180%);-webkit-backdrop-filter:blur(16px) saturate(180%);border-bottom:1px solid rgba(255,255,255,0.08);transition:all 0.25s ease}
        .navbar .container{display:flex;align-items:center;justify-content:space-between}
        .logo{display:flex;align-items:center;gap:10px;font-size:1.75rem;font-weight:900;letter-spacing:-0.02em;text-decoration:none;color:#fff}
        .logo-icon{display:flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,#f97316,#ec4899,#8b5cf6);box-shadow:0 8px 24px rgba(236,72,153,0.35);font-size:1.6rem}
        .logo span.gradient-logo{background:linear-gradient(135deg,#fcd34d,#f97316,#ec4899,#a78bfa);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
        .nav-links{display:flex;align-items:center;gap:32px;list-style:none}
        .nav-links a{text-decoration:none;color:rgba(255,255,255,0.75);font-weight:600;font-size:0.95rem;transition:color 0.2s ease;letter-spacing:0.01em}
        .nav-links a:hover{color:#fff}
        .nav-cta{display:flex;align-items:center;gap:14px}
        .btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:12px 28px;border-radius:60px;font-weight:700;font-size:0.95rem;text-decoration:none;transition:all 0.25s ease;border:none;cursor:pointer;letter-spacing:0.01em;white-space:nowrap}
        .btn-primary{background:linear-gradient(135deg,#f97316,#ec4899,#8b5cf6);color:#fff;box-shadow:0 8px 24px rgba(236,72,153,0.4);position:relative;overflow:hidden}
        .btn-primary::after{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,0.25),transparent);opacity:0;transition:opacity 0.25s ease}
        .btn-primary:hover{transform:translateY(-2px) scale(1.02);box-shadow:0 14px 32px rgba(236,72,153,0.55)}
        .btn-primary:hover::after{opacity:1}
        .btn-outline{background:transparent;color:#fff;border:1.5px solid rgba(255,255,255,0.2);backdrop-filter:blur(4px)}
        .btn-outline:hover{border-color:rgba(255,255,255,0.6);background:rgba(255,255,255,0.06);transform:translateY(-2px)}
        .mobile-toggle{display:none;background:transparent;border:none;color:#fff;font-size:1.8rem;cursor:pointer;padding:4px}
        .hero{position:relative;min-height:100vh;display:flex;align-items:center;padding:120px 0 80px;overflow:hidden}
        .hero::before{content:'';position:absolute;top:-30%;left:-10%;width:600px;height:600px;background:radial-gradient(circle,rgba(249,115,22,0.35) 0%,transparent 70%);border-radius:50%;filter:blur(80px);animation:floatBlob 14s ease-in-out infinite alternate;z-index:0}
        .hero::after{content:'';position:absolute;bottom:-20%;right:-10%;width:700px;height:700px;background:radial-gradient(circle,rgba(139,92,246,0.4) 0%,transparent 70%);border-radius:50%;filter:blur(90px);animation:floatBlob 18s ease-in-out infinite alternate-reverse;z-index:0}
        @keyframes floatBlob{0%{transform:translate(0,0) scale(1)}100%{transform:translate(60px,-40px) scale(1.15)}}
        .hero .container{position:relative;z-index:2;display:grid;grid-template-columns:1fr 1fr;gap:60px;align-items:center}
        .hero-content{max-width:600px}
        .hero-badge{display:inline-flex;align-items:center;gap:8px;padding:8px 18px;border-radius:60px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);font-size:0.85rem;font-weight:600;letter-spacing:0.03em;text-transform:uppercase;color:#fcd34d;margin-bottom:28px;backdrop-filter:blur(4px)}
        .hero-badge i{font-size:0.9rem;color:#f97316}
        .hero-title{font-size:4.2rem;font-weight:900;line-height:1.08;letter-spacing:-0.03em;margin-bottom:24px}
        .hero-title .gradient-text{background:linear-gradient(135deg,#fcd34d 0%,#f97316 30%,#ec4899 65%,#a78bfa 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
        .hero-sub{font-size:1.2rem;color:rgba(255,255,255,0.7);margin-bottom:40px;line-height:1.7;max-width:520px}
        .hero-actions{display:flex;flex-wrap:wrap;gap:16px;align-items:center}
        .hero-stats{display:flex;gap:48px;margin-top:56px;padding-top:32px;border-top:1px solid rgba(255,255,255,0.08)}
        .stat-item h3{font-size:2rem;font-weight:800;background:linear-gradient(135deg,#fcd34d,#f97316,#ec4899);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:-0.02em;line-height:1.2}
        .stat-item p{font-size:0.9rem;color:rgba(255,255,255,0.55);font-weight:500;letter-spacing:0.02em}
        .hero-visual{position:relative;display:flex;justify-content:center;align-items:center;min-height:480px}
        .card-stack{position:relative;width:100%;max-width:420px;aspect-ratio:0.85}
        .stack-card{position:absolute;inset:0;border-radius:32px;padding:32px;display:flex;flex-direction:column;justify-content:flex-end;box-shadow:0 30px 60px -15px rgba(0,0,0,0.7);transition:all 0.4s cubic-bezier(0.23,1,0.32,1);border:1px solid rgba(255,255,255,0.12);overflow:hidden}
        .stack-card:nth-child(1){background:linear-gradient(135deg,#f97316,#ec4899);transform:rotate(-6deg) translate(-30px,-20px) scale(0.92);z-index:1;opacity:0.7}
        .stack-card:nth-child(2){background:linear-gradient(135deg,#8b5cf6,#06b6d4);transform:rotate(3deg) translate(20px,-10px) scale(0.96);z-index:2;opacity:0.85}
        .stack-card:nth-child(3){background:linear-gradient(135deg,#facc15,#f97316,#ef4444);transform:rotate(-1deg) translate(0,0) scale(1);z-index:3;box-shadow:0 40px 80px -20px rgba(249,115,22,0.5)}
        .stack-card .card-icon{font-size:2.6rem;margin-bottom:16px;color:rgba(255,255,255,0.9)}
        .stack-card h4{font-size:1.6rem;font-weight:800;line-height:1.2;margin-bottom:8px;letter-spacing:-0.02em}
        .stack-card p{font-size:0.95rem;color:rgba(255,255,255,0.85);font-weight:500;line-height:1.5}
        .stack-card .card-tag{display:inline-block;align-self:flex-start;padding:6px 16px;border-radius:60px;background:rgba(0,0,0,0.25);backdrop-filter:blur(4px);font-size:0.75rem;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;margin-bottom:16px;border:1px solid rgba(255,255,255,0.15)}
        .features{padding:100px 0;position:relative;background:#0d0f1a}
        .section-header{text-align:center;max-width:760px;margin:0 auto 56px}
        .section-label{display:inline-block;font-size:0.8rem;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:#f97316;margin-bottom:16px;padding:6px 18px;border-radius:60px;background:rgba(249,115,22,0.12);border:1px solid rgba(249,115,22,0.25)}
        .section-title{font-size:3rem;font-weight:900;letter-spacing:-0.03em;line-height:1.15;margin-bottom:20px}
        .section-title .highlight{background:linear-gradient(135deg,#fcd34d,#f97316,#ec4899,#a78bfa);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
        .section-desc{font-size:1.15rem;color:rgba(255,255,255,0.6);line-height:1.7}
        .bento-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;grid-auto-rows:220px}
        .bento-item{border-radius:28px;padding:32px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden;transition:transform 0.35s cubic-bezier(0.23,1,0.32,1),box-shadow 0.35s ease;border:1px solid rgba(255,255,255,0.08);cursor:default}
        .bento-item:hover{transform:translateY(-6px) scale(1.01);box-shadow:0 30px 50px -20px rgba(0,0,0,0.8)}
        .bento-item .bento-icon{font-size:2.2rem;color:rgba(255,255,255,0.9);margin-bottom:12px}
        .bento-item h3{font-size:1.3rem;font-weight:800;letter-spacing:-0.02em;line-height:1.3;margin-bottom:8px}
        .bento-item p{font-size:0.92rem;color:rgba(255,255,255,0.7);line-height:1.5;font-weight:500}
        .bento-item .bento-tag{font-size:0.7rem;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;opacity:0.7;margin-top:12px}
        .bento-1{grid-column:span 2;grid-row:span 2;background:linear-gradient(145deg,#f97316,#ec4899,#8b5cf6)}
        .bento-1 h3{font-size:2rem}
        .bento-1 p{font-size:1rem;max-width:380px}
        .bento-2{background:linear-gradient(145deg,#1e1b4b,#312e81)}
        .bento-3{background:linear-gradient(145deg,#0f172a,#1e293b)}
        .bento-4{grid-row:span 2;background:linear-gradient(145deg,#06b6d4,#8b5cf6)}
        .bento-5{grid-column:span 2;background:linear-gradient(145deg,#facc15,#f97316)}
        .bento-5 h3{color:#1a1a2e}.bento-5 p{color:rgba(0,0,0,0.7)}.bento-5 .bento-icon{color:#1a1a2e}
        .bento-6{background:linear-gradient(145deg,#10b981,#06b6d4)}
        .marquee-section{padding:60px 0;overflow:hidden;border-top:1px solid rgba(255,255,255,0.06);border-bottom:1px solid rgba(255,255,255,0.06);background:rgba(0,0,0,0.25)}
        .marquee{display:flex;gap:48px;animation:scrollMarquee 28s linear infinite;width:max-content}
        .marquee-item{display:flex;align-items:center;gap:12px;font-size:1.4rem;font-weight:800;letter-spacing:-0.02em;white-space:nowrap;color:rgba(255,255,255,0.25);transition:color 0.3s ease}
        .marquee-item i{font-size:1.8rem;background:linear-gradient(135deg,#f97316,#ec4899,#8b5cf6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
        .marquee-item:hover{color:rgba(255,255,255,0.8)}
        @keyframes scrollMarquee{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
        .cta-section{padding:120px 0;position:relative;overflow:hidden;background:#0d0f1a}
        .cta-section::before{content:'';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:900px;height:900px;background:radial-gradient(circle,rgba(249,115,22,0.12) 0%,rgba(139,92,246,0.08) 40%,transparent 70%);border-radius:50%;filter:blur(60px);z-index:0}
        .cta-card{position:relative;z-index:2;border-radius:48px;padding:80px 60px;background:linear-gradient(135deg,#1e1b4b,#0f172a);border:1px solid rgba(255,255,255,0.08);text-align:center;overflow:hidden;box-shadow:0 50px 100px -30px rgba(0,0,0,0.8)}
        .cta-card::before{content:'';position:absolute;top:-50%;right:-20%;width:500px;height:500px;background:radial-gradient(circle,rgba(236,72,153,0.25) 0%,transparent 70%);border-radius:50%;filter:blur(60px)}
        .cta-card::after{content:'';position:absolute;bottom:-40%;left:-10%;width:450px;height:450px;background:radial-gradient(circle,rgba(6,182,212,0.2) 0%,transparent 70%);border-radius:50%;filter:blur(60px)}
        .cta-card h2{position:relative;z-index:2;font-size:3.4rem;font-weight:900;letter-spacing:-0.03em;line-height:1.1;margin-bottom:20px}
        .cta-card h2 .gradient-text{background:linear-gradient(135deg,#fcd34d,#f97316,#ec4899,#a78bfa);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
        .cta-card p{position:relative;z-index:2;font-size:1.2rem;color:rgba(255,255,255,0.65);max-width:560px;margin:0 auto 40px;line-height:1.7}
        .cta-actions{position:relative;z-index:2;display:flex;justify-content:center;gap:18px;flex-wrap:wrap}
        footer{padding:60px 0 40px;background:#080a12;border-top:1px solid rgba(255,255,255,0.06)}
        .footer-grid{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:48px;margin-bottom:48px}
        .footer-brand p{color:rgba(255,255,255,0.5);font-size:0.95rem;line-height:1.7;margin-top:16px;max-width:320px}
        .footer-col h4{font-size:1rem;font-weight:700;margin-bottom:20px;color:#fff;letter-spacing:0.01em}
        .footer-col ul{list-style:none;display:flex;flex-direction:column;gap:12px}
        .footer-col a{color:rgba(255,255,255,0.5);text-decoration:none;font-size:0.92rem;font-weight:500;transition:color 0.2s ease}
        .footer-col a:hover{color:#f97316}
        .footer-bottom{padding-top:32px;border-top:1px solid rgba(255,255,255,0.06);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:20px}
        .footer-bottom p{color:rgba(255,255,255,0.35);font-size:0.9rem}
        .social-links{display:flex;gap:16px}
        .social-links a{display:flex;align-items:center;justify-content:center;width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.08);color:rgba(255,255,255,0.6);text-decoration:none;transition:all 0.25s ease;font-size:1.1rem}
        .social-links a:hover{background:linear-gradient(135deg,#f97316,#ec4899,#8b5cf6);color:#fff;border-color:transparent;transform:translateY(-3px);box-shadow:0 8px 20px rgba(236,72,153,0.4)}

        /* BUILDER SPECIFIC */
        .builder-section{padding:100px 0 40px;background:#0d0f1a;position:relative}
        .builder-section::before{content:'';position:absolute;top:10%;left:50%;transform:translateX(-50%);width:800px;height:800px;background:radial-gradient(circle,rgba(139,92,246,0.15) 0%,transparent 70%);filter:blur(80px);pointer-events:none}
        .dark-input{width:100%;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);color:#fff;padding:14px 18px;border-radius:14px;font-size:0.95rem;font-weight:500;outline:none;transition:all 0.2s ease;font-family:Inter,sans-serif}
        .dark-input::placeholder{color:rgba(255,255,255,0.35)}
        .dark-input:focus{border-color:rgba(249,115,22,0.55);box-shadow:0 0 0 4px rgba(249,115,22,0.12);background:rgba(255,255,255,0.08)}
        .builder-main-grid{display:grid;grid-template-columns:1.15fr 0.85fr;gap:22px;align-items:start}
        .builder-form-card{border-radius:28px;padding:32px;background:linear-gradient(145deg,#151827,#1a1e33);border:1px solid rgba(255,255,255,0.08);box-shadow:0 20px 60px -20px rgba(0,0,0,0.6)}
        .upload-zone{border:2px dashed rgba(255,255,255,0.15);background:rgba(255,255,255,0.03);border-radius:24px;padding:24px;text-align:center;transition:all 0.25s ease;cursor:pointer;position:relative;overflow:hidden}
        .upload-zone:hover{border-color:rgba(249,115,22,0.45);background:rgba(255,255,255,0.05);transform:translateY(-2px)}
        .preview-img{width:112px;height:112px;border-radius:22px;object-fit:cover;border:2px solid rgba(255,255,255,0.12);box-shadow:0 12px 32px rgba(0,0,0,0.5);background:#0d0f1a}
        .paid-badge{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:60px;background:linear-gradient(135deg,#facc15,#f97316);color:#1a1a2e;font-weight:800;font-size:0.68rem;letter-spacing:0.06em;box-shadow:0 6px 18px rgba(250,204,21,0.35);text-transform:uppercase}
        .progress-wrap{background:rgba(255,255,255,0.06);border-radius:60px;height:16px;overflow:hidden;position:relative;border:1px solid rgba(255,255,255,0.08);box-shadow:inset 0 2px 8px rgba(0,0,0,0.4)}
        .progress-fill{height:100%;background:linear-gradient(90deg,#f97316,#ec4899,#8b5cf6);border-radius:60px;transition:width 0.45s cubic-bezier(0.23,1,0.32,1);position:relative;overflow:hidden}
        .progress-fill::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.35),transparent);animation:shimmer 1.3s infinite}
        @keyframes shimmer{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
        .percent-badge{background:linear-gradient(135deg,#f97316,#ec4899);color:#fff;padding:7px 16px;border-radius:60px;font-weight:800;font-size:0.88rem;box-shadow:0 8px 20px rgba(236,72,153,0.35);border:1px solid rgba(255,255,255,0.15)}
        .step-pill{display:inline-flex;padding:6px 14px;border-radius:60px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.08);font-size:0.78rem;font-weight:600;color:rgba(255,255,255,0.7);letter-spacing:0.02em}
        .step-pill.active{background:linear-gradient(135deg,rgba(249,115,22,0.2),rgba(236,72,153,0.2));border-color:rgba(249,115,22,0.35);color:#fff}
        .download-card{border-radius:28px;padding:28px;position:relative;overflow:hidden;transition:transform 0.3s ease, box-shadow 0.3s ease;border:1px solid rgba(255,255,255,0.08)}
        .download-card:hover{transform:translateY(-4px)}
        .free-card{background:linear-gradient(135deg,#10b981,#06b6d4,#6366f1);box-shadow:0 20px 50px -15px rgba(16,185,129,0.45)}
        .pro-card{background:linear-gradient(145deg,#1a1a2e,#0f0f1a);border:2px solid #facc15;box-shadow:0 20px 60px -15px rgba(250,204,21,0.25)}
        .toggle-wrap{display:flex;align-items:center;gap:14px;padding:14px 18px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:16px}
        .switch{width:52px;height:30px;background:rgba(255,255,255,0.12);border-radius:60px;position:relative;cursor:pointer;transition:all 0.25s ease;border:1px solid rgba(255,255,255,0.1)}
        .switch.on{background:linear-gradient(135deg,#f97316,#ec4899)}
        .switch-knob{width:24px;height:24px;background:#fff;border-radius:50%;position:absolute;top:2px;left:2px;transition:all 0.25s cubic-bezier(0.23,1,0.32,1);box-shadow:0 2px 8px rgba(0,0,0,0.3)}
        .switch.on .switch-knob{left:24px}
        .compare-section{padding:80px 0;background:#0d0f1a}
        .compare-table{width:100%;border-collapse:separate;border-spacing:0;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.08);border-radius:24px;overflow:hidden}
        .compare-table th{padding:18px 22px;text-align:left;font-weight:800;font-size:0.9rem;letter-spacing:0.04em;text-transform:uppercase;color:rgba(255,255,255,0.5);background:rgba(255,255,255,0.02);border-bottom:1px solid rgba(255,255,255,0.08)}
        .compare-table td{padding:16px 22px;border-bottom:1px solid rgba(255,255,255,0.06);font-weight:500;color:rgba(255,255,255,0.8)}
        .compare-table tr:last-child td{border-bottom:none}
        .trust-section{padding:80px 0 100px;background:#0d0f1a}
        .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.82);backdrop-filter:blur(16px);z-index:2000;display:flex;align-items:center;justify-content:center;padding:20px;animation:fadeIn 0.25s ease}
        @keyframes fadeIn{from{opacity:0}to{opacity:1}}
        .modal-card{background:linear-gradient(135deg,#1e1b4b,#0f172a);border:1px solid rgba(255,255,255,0.12);border-radius:32px;padding:32px;max-width:480px;width:100%;max-height:92vh;overflow-y:auto;position:relative;box-shadow:0 30px 80px rgba(0,0,0,0.9);animation:slideUp 0.35s cubic-bezier(0.23,1,0.32,1)}
        @keyframes slideUp{from{transform:translateY(20px) scale(0.97);opacity:0}to{transform:translateY(0) scale(1);opacity:1}}
        .qr-box{background:#fff;border-radius:20px;padding:16px;display:flex;align-items:center;justify-content:center;min-height:260px;box-shadow:0 12px 40px rgba(0,0,0,0.5)}
        .qr-box img{max-width:100%;border-radius:12px}
        .btn-big{height:64px;padding:0 36px;font-size:1.05rem;letter-spacing:-0.01em;border-radius:60px}
        @media(max-width:1024px){
          .hero .container{grid-template-columns:1fr;text-align:center}
          .hero-content{max-width:100%;display:flex;flex-direction:column;align-items:center}
          .hero-sub{max-width:100%}
          .hero-actions{justify-content:center}
          .hero-stats{justify-content:center}
          .hero-visual{min-height:400px;margin-top:40px}
          .bento-grid{grid-template-columns:repeat(2,1fr);grid-auto-rows:200px}
          .bento-1{grid-column:span 2;grid-row:span 1}
          .bento-4{grid-row:span 1}
          .bento-5{grid-column:span 2}
          .footer-grid{grid-template-columns:1fr 1fr}
          .builder-main-grid{grid-template-columns:1fr}
        }
        @media(max-width:768px){
          .nav-links{display:none}
          .mobile-toggle{display:block}
          .nav-cta .btn-outline{display:none}
          .hero-title{font-size:2.8rem}
          .section-title{font-size:2.2rem}
          .bento-grid{grid-template-columns:1fr;grid-auto-rows:auto}
          .bento-1{grid-column:span 1}
          .bento-5{grid-column:span 1}
