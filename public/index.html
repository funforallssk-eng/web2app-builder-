<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Web2App Builder</title>
<style>*{box-sizing:border-box}body{font-family:system-ui;max-width:700px;margin:40px auto;padding:20px;background:#fafafa}.card{background:#fff;padding:30px;border-radius:16px;box-shadow:0 4px 20px rgba(0,0,0,.08)}input{width:100%;padding:14px;margin:10px 0;border:2px solid #e5e7eb;border-radius:10px}button{width:100%;padding:16px;background:#111;color:#fff;border:0;border-radius:10px;font-size:18px;font-weight:600;cursor:pointer}button:disabled{background:#999}.btn{display:inline-block;padding:16px 28px;margin:8px;border-radius:10px;color:#fff;text-decoration:none;font-weight:600}</style>
</head><body><div class="card">
<h1>🚀 Web2App Builder</h1>
<p>Website → APK + AAB in 3 mins</p>
<form id="f"><input id="url" value="https://store.cheapodeal.com.au" required><input id="appName" value="CheapoDeal" required><input id="packageName" value="com.cheapodeal.app" required><button id="b">Build APK + AAB</button></form>
<div id="s" style="margin-top:20px"></div>
<div id="d" style="display:none;text-align:center;margin-top:20px">
<h2>✅ Build Ready!</h2>
<a id="apk" href="#" class="btn" style="background:#10b981">📱 Download APK</a>
<a id="aab" href="#" class="btn" style="background:#3b82f6">📦 Download AAB</a>
</div></div>
<script>
document.getElementById('f').addEventListener('submit', async(e)=>{
e.preventDefault(); const btn=document.getElementById('b'), s=document.getElementById('s'), d=document.getElementById('d');
btn.disabled=true; btn.innerText='⏳ Building... 3-4 mins'; s.innerHTML='Build started... Please wait 3 mins';
const payload={url:document.getElementById('url').value, appName:document.getElementById('appName').value, packageName:document.getElementById('packageName').value};
try{
const {buildId}=await fetch('/api/build',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}).then(r=>r.json());
let sec=0; const t=setInterval(()=>{sec+=5; s.innerHTML=`Building... ${sec}s elapsed`},5000);
const c=setInterval(async()=>{
const chk=await fetch('/api/check/'+buildId).then(r=>r.json());
if(chk.ready){clearInterval(c); clearInterval(t);
s.innerHTML='🎉 Build Complete!'; d.style.display='block';
document.getElementById('apk').href='/api/download/'+buildId+'/apk';
document.getElementById('aab').href='/api/download/'+buildId+'/aab';
btn.disabled=false; btn.innerText='Build Another App';}
},15000);
}catch(err){s.innerHTML='❌ '+err.message; btn.disabled=false;}
});
</script></body></html>
